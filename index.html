<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Scan & Identify</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0b0b0f;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #camera-wrap {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  canvas { display: none; }
  #controls {
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0f;
  }
  #shutter {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #444;
    cursor: pointer;
  }
  #shutter:active { background: #ccc; }
  #result {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15,15,20,0.95);
    padding: 20px;
    border-radius: 20px 20px 0 0;
    max-height: 55%;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }
  #result.visible { transform: translateY(0); }
  #result h2 {
    margin: 0 0 8px 0;
    font-size: 20px;
  }
  #result p {
    margin: 0;
    line-height: 1.5;
    color: #ddd;
    font-size: 15px;
  }
  #close-result {
    position: absolute;
    top: 10px;
    right: 16px;
    background: none;
    border: none;
    color: #999;
    font-size: 22px;
    cursor: pointer;
  }
  #loading {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
  }
  #loading.visible { display: flex; }
  #status {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    text-align: center;
    color: #f66;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status"></div>
  <div id="loading"><div>Analyzing…</div></div>
  <div id="result">
    <button id="close-result">&times;</button>
    <h2 id="result-title">Title</h2>
    <p id="result-text">Description</p>
  </div>
</div>

<div id="controls">
  <button id="shutter" aria-label="Scan"></button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const shutter = document.getElementById('shutter');
const resultBox = document.getElementById('result');
const resultTitle = document.getElementById('result-title');
const resultText = document.getElementById('result-text');
const closeResult = document.getElementById('close-result');
const loading = document.getElementById('loading');
const status = document.getElementById('status');

// Same-origin backend — works both locally and once deployed on Render
const API_URL = '/analyze';

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    video.srcObject = stream;
  } catch (err) {
    showStatus('Camera access denied or unavailable: ' + err.message);
  }
}

function showStatus(msg) {
  status.textContent = msg;
  status.style.display = 'block';
}

shutter.addEventListener('click', async () => {
  status.style.display = 'none';
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  const base64 = dataUrl.split(',')[1];

  loading.classList.add('visible');
  resultBox.classList.remove('visible');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64 })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Request failed');

    const fullText = data.description || '';
    const lines = fullText.split('\n').filter(l => l.trim());
    resultTitle.textContent = lines[0] || 'Result';
    resultText.textContent = lines.slice(1).join(' ') || fullText;

    resultBox.classList.add('visible');
  } catch (err) {
    showStatus('Error: ' + err.message);
  } finally {
    loading.classList.remove('visible');
  }
});

closeResult.addEventListener('click', () => {
  resultBox.classList.remove('visible');
});

startCamera();
</script>

</body>
</html>
