<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Scan & Identify</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f5f5f7;
    display: flex;
    flex-direction: column;
    /* dynamic viewport height: falls back gracefully on browsers that don't support dvh */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #camera-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0; /* critical: lets flex child shrink instead of overflowing */
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  canvas { display: none; }

  /* Permission / error state shown in place of the video */
  #permission-screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    background: #101014;
  }
  #permission-screen.visible { display: flex; }
  #permission-screen .icon {
    width: 56px;
    height: 56px;
    margin-bottom: 18px;
    opacity: 0.6;
  }
  #permission-screen h2 {
    font-size: 18px;
    margin: 0 0 10px;
    font-weight: 600;
  }
  #permission-screen p {
    font-size: 14px;
    line-height: 1.6;
    color: #a3a3ad;
    margin: 0 0 22px;
    max-width: 320px;
  }
  #retry-camera {
    background: #f5f5f7;
    color: #0a0a0d;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #retry-camera:active { background: #ccc; }

  /* Bottom control bar — fixed height, never shrinks, always visible */
  #controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px 0 calc(18px + env(safe-area-inset-bottom, 0px));
    background: #0a0a0d;
    border-top: 1px solid #1c1c22;
  }
  #shutter {
    width: 68px;
    height: 68px;
    min-width: 68px;
    min-height: 68px;
    border-radius: 50%;
    background: #f5f5f7;
    border: 4px solid #3a3a42;
    cursor: pointer;
    padding: 0;
    -webkit-appearance: none;
    appearance: none;
    display: block;
    flex-shrink: 0;
  }
  #shutter:active { background: #ccc; transform: scale(0.96); }
  #shutter:disabled { opacity: 0.4; }

  #result {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(16,16,20,0.97);
    backdrop-filter: blur(6px);
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
    border-radius: 20px 20px 0 0;
    max-height: 60%;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.28s ease;
  }
  #result.visible { transform: translateY(0); }
  #result h2 {
    margin: 0 0 8px 0;
    font-size: 19px;
    font-weight: 600;
    padding-right: 28px;
  }
  #result p {
    margin: 0;
    line-height: 1.55;
    color: #cfcfd6;
    font-size: 15px;
  }
  #close-result {
    position: absolute;
    top: 14px;
    right: 16px;
    background: #1c1c22;
    border: none;
    color: #cfcfd6;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  #loading {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #fff;
    gap: 10px;
  }
  #loading.visible { display: flex; }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: absolute;
    top: max(16px, env(safe-area-inset-top, 16px));
    left: 16px;
    right: 16px;
    background: rgba(220,60,60,0.95);
    color: #fff;
    padding: 12px 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    line-height: 1.4;
    display: none;
    z-index: 10;
  }
  #toast.visible { display: block; }
</style>
</head>
<body>

<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="permission-screen">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 7h3l2-2h8l2 2h3v12H3z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
    <h2>Camera access needed</h2>
    <p id="permission-text">Allow camera access to start scanning. If you already denied it, open your browser's site settings and turn Camera on for this page.</p>
    <button id="retry-camera">Try again</button>
  </div>

  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><div>Analyzing…</div></div>

  <div id="result">
    <button id="close-result" aria-label="Close">&times;</button>
    <h2 id="result-title">Title</h2>
    <p id="result-text">Description</p>
  </div>
</div>

<div id="controls">
  <button id="shutter" aria-label="Scan"></button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const shutter = document.getElementById('shutter');
const resultBox = document.getElementById('result');
const resultTitle = document.getElementById('result-title');
const resultText = document.getElementById('result-text');
const closeResult = document.getElementById('close-result');
const loading = document.getElementById('loading');
const toast = document.getElementById('toast');
const permissionScreen = document.getElementById('permission-screen');
const permissionText = document.getElementById('permission-text');
const retryCamera = document.getElementById('retry-camera');

const API_URL = '/analyze';

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 4000);
}

function showPermissionScreen(message) {
  if (message) permissionText.textContent = message;
  permissionScreen.classList.add('visible');
  shutter.disabled = true;
}

function hidePermissionScreen() {
  permissionScreen.classList.remove('visible');
  shutter.disabled = false;
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showPermissionScreen('This browser does not support camera access. Try Chrome or Safari.');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
    hidePermissionScreen();
  } catch (err) {
    let msg = 'Camera access failed: ' + err.message;
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      msg = 'Camera permission was blocked. Tap the lock icon in your address bar, allow Camera, then tap Try again.';
    } else if (err.name === 'NotFoundError') {
      msg = 'No camera was found on this device.';
    } else if (err.name === 'NotReadableError') {
      msg = 'Camera is in use by another app. Close it and try again.';
    }
    showPermissionScreen(msg);
  }
}

retryCamera.addEventListener('click', startCamera);

shutter.addEventListener('click', async () => {
  if (!video.videoWidth) {
    showToast('Camera is not ready yet — one moment.');
    return;
  }
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  const base64 = dataUrl.split(',')[1];

  loading.classList.add('visible');
  resultBox.classList.remove('visible');
  shutter.disabled = true;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64 })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Request failed');

    const fullText = data.description || '';
    const lines = fullText.split('\n').filter(l => l.trim());
    resultTitle.textContent = lines[0] || 'Result';
    resultText.textContent = lines.slice(1).join(' ') || fullText;

    resultBox.classList.add('visible');
  } catch (err) {
    showToast('Error: ' + err.message);
  } finally {
    loading.classList.remove('visible');
    shutter.disabled = false;
  }
});

closeResult.addEventListener('click', () => {
  resultBox.classList.remove('visible');
});

startCamera();
</script>

</body>
</html>
